plugins {
    id 'com.android.application'
}

// Engine core module (detected by CI, default :Bcore)
def coreModule = findProperty('coreModule') ?: ':Bcore'

android {
    namespace 'com.multislots.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.multislots.app'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('SLOTS_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SLOTS_KEYSTORE_PASSWORD')
                keyAlias 'slots'
                keyPassword System.getenv('SLOTS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SLOTS_KEYSTORE')) signingConfig signingConfigs.release
            else signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(coreModule)
}
