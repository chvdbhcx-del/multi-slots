name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Open-source virtualization engine (Apache-2.0). Pin to a commit once a build is green.
  ENGINE_REPO: https://github.com/ALEX5402/NewBlackbox.git
  ENGINE_REF: 89b59836c66f173756a4ae258cf379a957649820

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch engine
        run: |
          git clone "$ENGINE_REPO" engine
          cd engine
          git checkout "$ENGINE_REF"
          echo "Engine commit: $(git log -1 --format='%H %cd')"
          echo "--- settings"; cat settings.gradle* || true
          echo "--- modules"; ls
          echo "--- sample app build file"; cat app/build.gradle* 2>/dev/null | head -80 || true

      - name: Detect engine core module and SDK levels
        id: detect
        run: |
          cd engine
          core_file=$(grep -rl --include=BlackBoxCore.java --include=BlackBoxCore.kt "class BlackBoxCore" . | head -1)
          echo "Core class: $core_file"
          core_dir=$(echo "$core_file" | sed -E 's#^\./([^/]+)/.*#\1#')
          echo "core=:$core_dir" >> "$GITHUB_OUTPUT"
          ndk=$(grep -rhoP "ndkVersion\s*=?\s*[\"']\K[^\"']+" --include='*.gradle*' . | head -1 || true)
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
          csdk=$(grep -rhoP "compileSdk(Version)?\s*=?\s*\K[0-9]+" --include='*.gradle*' . | sort -n | tail -1 || true)
          echo "compileSdk=${csdk:-34}" >> "$GITHUB_OUTPUT"
          tsdk=$(grep -hoP "targetSdk(Version)?\s*=?\s*\K[0-9]+" app/build.gradle* 2>/dev/null | head -1 || true)
          echo "targetSdk=${tsdk:-28}" >> "$GITHUB_OUTPUT"
          echo "core=:$core_dir ndk=$ndk compileSdk=$csdk targetSdk=$tsdk"

      - name: Install NDK
        if: steps.detect.outputs.ndk != ''
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ steps.detect.outputs.ndk }}" > /dev/null

      - name: Put our app in place of the engine's sample app
        run: |
          rm -rf engine/app
          cp -r app engine/app
          cd engine
          f=$(ls settings.gradle* | head -1)
          grep -qE "['\"]:app['\"]" "$f" || echo "include ':app'" >> "$f"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SLOTS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/slots.jks"
            echo "SLOTS_KEYSTORE=$RUNNER_TEMP/slots.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SLOTS_KEYSTORE_B64 secret: APK is signed with a throwaway debug key and cannot be updated in place."
          fi

      - name: Build
        working-directory: engine
        env:
          SLOTS_KEYSTORE_PASSWORD: ${{ secrets.SLOTS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PcoreModule='${{ steps.detect.outputs.core }}' \
            -PslotsCompileSdk='${{ steps.detect.outputs.compileSdk }}' \
            -PslotsTargetSdk='${{ steps.detect.outputs.targetSdk }}'
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/MultiSlots-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiSlots-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Multi Slots ${{ github.run_number }}" \
            --notes "Сборка из ${{ github.sha }}. Скачайте APK на телефон и установите."
